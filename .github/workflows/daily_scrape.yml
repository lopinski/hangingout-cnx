name: Daily listings refresh

on:
  schedule:
    # 05:00 UTC = 12:00 noon in Chiang Mai (ICT, UTC+7)
    - cron: '0 5 * * *'
  # Run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Optional. Add this repository secret to let the workflow publish to Netlify.
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The engine uses the standard library only, so there is nothing to install.
      - name: Run the unit tests
        run: python -m unittest discover -s scraper_engine/tests -t .

      - name: Aggregate events
        run: python scraper_engine/pipeline.py

      - name: Commit the refreshed listings
        id: commit
        run: |
          git config user.name 'HangingOut Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add events.json events.js sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Refresh listings $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The Netlify site is not linked to this repository, so the workflow deploys it
      # directly. This step is skipped until a NETLIFY_AUTH_TOKEN secret exists.
      - name: Deploy to Netlify
        if: steps.commit.outputs.changed == 'true' && env.NETLIFY_AUTH_TOKEN != ''
        env:
          NETLIFY_SITE_ID: 437dca3b-9632-499e-829e-c8f97d5ce372
        run: npx --yes netlify-cli deploy --prod --dir=. --site "$NETLIFY_SITE_ID" --message "Daily listings refresh"
